<div class="trading-tab-page tab-content flexContentColumn8 trading-tab-page--messages">  <div class="trading-tab-page__messages mt-3">    @if (viewModel$ | async; as viewModel) {      @if (viewModel.user.IsWorker) {        <app-messages          [sessionIds]="viewModel.sessionIds"          [tabIndex]="tabId"          [isAdmissionFinished]="viewModel.isAdmissionFinished"          (countInboxUnansweredEvent)="onInboxCountChange($event)"        />      } @else {        <app-chat-trader          [sessionIds]="viewModel.sessionIds"          [tabIndex]="tabId"          [isAdmissionFinished]="viewModel.isAdmissionFinished"        />      }    }  </div></div>
