<div class="trading-tab-page tab-content flexContentColumn8">
  @if (viewModel$ | async; as viewModel) {
    <app-deals
      [sessionInfo]="viewModel.sessionInfo"
      [sessionIds]="viewModel.sessionIds"
      [tabIndex]="tabId"
      [isAdmissionFinished]="viewModel.isAdmissionFinished"
      [isCalcFeeFinished]="viewModel.isCalcFeeFinished"
    />
  }
</div>
