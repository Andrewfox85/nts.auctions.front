<label
  class="dx-checkbox"
  [class.dx-state-disabled]="disabled()"
  (click)="onToggle()"
>
  <span class="dx-checkbox-icon" [class.checked]="value">
    @if (value) {
    <svg viewBox="0 0 24 24" class="check-icon">
      <path
        fill="currentColor"
        d="M20.3 5.7a1 1 0 0 0-1.4 0L10 14.6l-4.9-4.9a1 1 0 1 0-1.4 1.4l5.6 5.6a1 1 0 0 0 1.4 0l9.6-9.6a1 1 0 0 0 0-1.4z"
      />
    </svg>
    }
  </span>
  <span class="dx-checkbox-text">{{ text() }}</span>
</label>
